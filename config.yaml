# Search parameters. Edit freely; nothing here is code.

search:
  # A title must contain one of these (case-insensitive) to be considered.
  title_include:
    - engineer
    - developer
    - software
    - full stack
    - fullstack
    - full-stack
    - backend
    - back-end
    - frontend
    - front-end
    - platform
    - devops
    - architect
  title_exclude:
    - sales
    - account executive
    - recruiter
    - intern
    - werkstudent
    - student
    - graduate
    - trainee
    - "sap "
    - salesforce
    - mainframe
    - principal
    - staff
    - director
    - head of
    - talent pool
    - vp
  remote_only: true
  # Region filter is loose on purpose: UK/EU jobs pass so the scorer can check whether they hire abroad.
  allowed_regions: [uk, eu, emea]
  # Where the candidate actually works from; the scorer judges eligibility against this.
  based_in: Kampala, Uganda (UTC+3), until July 2027
  max_age_days: 14
  # Languages a job may require; anything else is penalised in scoring.
  languages: [English, Spanish]

scoring:
  # Tried in order; free-tier quotas are per model, so the next takes over when one runs out.
  # otari/ entries are routing policies on the Otari gateway (otari/routing.yml) and need OTARI_API_KEY;
  # groq/ entries need GROQ_API_KEY. Either is skipped without its key, leaving the direct Gemini calls.
  models: [otari/job-score, gemini-3.5-flash-lite, gemini-3.1-flash-lite, groq/openai/gpt-oss-120b]
  # Parallel requests; keep low on the free tier, whose per-minute limit is small.
  workers: 2
  # Cost guard: jobs scored per run, newest first.
  max_per_run: 150
  shortlist_size: 5
  min_score: 60

tailoring:
  # Writing quality matters more here than at scoring, and it's only a handful of calls a day.
  models: [otari/job-tailor, gemini-3.6-flash, gemini-3.8-flash, groq/openai/gpt-oss-120b, gemini-3.5-flash-lite]
  check_models: [otari/job-check, gemini-3.6-flash, gemini-3.8-flash, groq/openai/gpt-oss-120b, gemini-3.5-flash-lite]

applications:
  # The Google Sheet that tracks applications (APPLICATIONS_SHEET_ID and a service account in .env).
  # The tab is the gid in the sheet's URL.
  sheet_gid: 1680940319
  # The sheet's header names for each field; the header row is read to find the columns, so their
  # order doesn't matter. Fields not listed here are left out of new rows.
  columns:
    date: Date
    role: Role
    company: Company
  # Companies applied to within this many months are neither scored nor shortlisted.
  exclude_months: 12

sources:
  # UK boards. Both need free API keys in .env and are skipped with a warning without them.
  reed:
    queries: [software engineer, developer]
    pages: 2
  adzuna:
    queries: [software engineer, developer]
    pages: 2
    max_days_old: 14
  remotive: true
  # RemoteOK is off: it charges candidates to apply.
  remoteok: false
  himalayas:
    queries: [software engineer, developer]
    # ISO codes; each also returns worldwide jobs.
    countries: [GB]
    pages: 3
  arbeitnow:
    pages: 5
  # Company job boards. The slug is the bit after the board's domain,
  # e.g. job-boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>.
  greenhouse: [gitlab]
  lever: []
  ashby: [linear]
