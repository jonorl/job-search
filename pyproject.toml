[project]
name = "job-search"
version = "0.1.0"
description = "Finds remote jobs, scores them against a master CV and prepares tailored applications"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34",
    "groq>=1.7",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "typst>=0.15",
]

[project.scripts]
job-search = "job_search.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_search*"]
