<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job applications</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dd;
    --accent: #2f5fd0; --good: #23824a; --warn: #a8650b; --bad: #b3372e; --chip: #eeeeea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1d; --text: #ebebe6; --muted: #9c9c95; --line: #33332f;
      --accent: #7c9ef0; --good: #5cbf83; --warn: #e0a24a; --bad: #e57a70; --chip: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .today { font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
  .today.done { color: var(--good); }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px;
    border-radius: 999px; border: 1px solid var(--good); color: var(--good); margin-left: 6px; vertical-align: 2px; }
  .applied-on { color: var(--good); font-size: 13px; margin-top: 2px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 5px 14px; cursor: pointer; font: inherit; }
  nav button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; background: var(--chip); }
  .banner.error { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .head { display: flex; gap: 14px; align-items: flex-start; }
  .score { font-weight: 700; font-size: 20px; min-width: 44px; text-align: center; padding: 4px 0;
    border-radius: 8px; background: var(--chip); }
  .title { font-weight: 600; font-size: 17px; }
  .meta { color: var(--muted); font-size: 13px; }
  .links { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0; }
  a { color: var(--accent); }
  ul { margin: 6px 0; padding-left: 20px; }
  .plus li::marker { content: "+  "; color: var(--good); }
  .minus li::marker { content: "–  "; color: var(--bad); }
  .warn { color: var(--warn); }
  details { margin: 8px 0; }
  summary { cursor: pointer; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .actions button, .qa button { font: inherit; padding: 6px 14px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .actions .applied { border-color: var(--good); color: var(--good); }
  .actions .reject { border-color: var(--bad); color: var(--bad); }
  .actions .interested { border-color: var(--accent); color: var(--accent); }
  .actions button:disabled { opacity: .5; cursor: default; }
  .toolbar { margin: 0 0 14px; }
  .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .qa { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .qa textarea, .qa input { width: 100%; font: inherit; padding: 8px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); margin: 4px 0 8px; }
  .qa textarea { min-height: 110px; }
  .answer { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .answer:last-child { border-bottom: 0; }
  .q { font-weight: 600; }
  .a { white-space: pre-wrap; margin: 4px 0; }
  .copy { font-size: 12px; padding: 2px 8px !important; }
  .empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<main>
  <header><h1>Job applications</h1><div id="today" class="today"></div></header>
  <nav id="tabs"></nav>
  <div id="banner"></div>
  <div id="list"></div>
</main>
<script>
const TABS = [
  ["shortlisted", "To review"], ["interested", "Interested"], ["applied", "Applied"], ["rejected", "Rejected"],
  ["expired", "Expired"],
];
let tab = "shortlisted", data = { jobs: [] }, timer, last = "";
// Each poll redraws the list, so what the user has opened or typed lives here rather than in the DOM.
const opened = {}, drafts = {};
document.addEventListener("toggle", e => { if (e.target.dataset.key) opened[e.target.dataset.key] = e.target.open; }, true);
document.addEventListener("input", e => { if (e.target.id) drafts[e.target.id] = e.target.value; });
const isOpen = (key, byDefault = false) => (opened[key] ?? byDefault) ? "open" : "";

const spin = task => task?.state === "working" ? `<span class="spinner" aria-hidden="true"></span>` : "";
// Elapsed time is ticked here rather than sent by the server, so polls don't redraw the page every few seconds.
const since = task => task?.state === "working" ? ` <span class="elapsed meta" data-started="${task.started}"></span>` : "";
setInterval(() => document.querySelectorAll(".elapsed").forEach(el => {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - el.dataset.started));
  el.textContent = `(${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")})`;
}), 1000);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function load() {
  const r = await fetch("api/jobs");
  const text = await r.text();
  if (!r.ok) {
    // Without this a server error leaves a blank page with the cause only in the console.
    document.getElementById("banner").innerHTML =
      `<div class="banner error">The server answered ${r.status} ${esc(r.statusText)}; see its log. Retrying in 30s.</div>`;
    clearTimeout(timer);
    timer = setTimeout(load, 30000);
    return;
  }
  // Redrawing an unchanged list would only interrupt whatever the user is reading or typing.
  if (text !== last) {
    last = text;
    data = JSON.parse(text);
    render();
  }
  // Quick polls while background work runs; slow ones otherwise, to pick up a cron run's new batch.
  const busy = data.leads?.state === "working" || data.jobs.some(j => j.task?.state === "working");
  clearTimeout(timer);
  timer = setTimeout(load, busy ? 3000 : 30000);
}

async function act(body) {
  try {
    const r = await fetch("api/action", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) alert((await r.json().catch(() => ({}))).detail || r.statusText);
    // Follow the job to where its questions are being answered; after applying, back to the queue.
    else if (body.action === "interested") tab = "interested";
    else if (body.action === "applied") tab = "shortlisted";
  } finally {
    render();
    load();
  }
}

// Days are the browser's, so "today" is Kampala's rather than the server's UTC.
const dayOf = iso => new Date(iso).toLocaleDateString("en-CA");
const ddmmyyyy = iso => new Date(iso).toLocaleDateString("en-GB");

function render() {
  const today = dayOf(new Date().toISOString());
  const done = data.jobs.filter(j => j.status === "applied" && j.applied_at && dayOf(j.applied_at) === today).length;
  const target = data.daily_target || 5;
  const counter = document.getElementById("today");
  counter.textContent = `Applied today: ${done}/${target}`;
  counter.classList.toggle("done", done >= target);

  document.getElementById("tabs").innerHTML = TABS.map(([key, label]) => {
    const n = data.jobs.filter(j => j.status === key).length;
    return `<button aria-pressed="${key === tab}" onclick="tab='${key}';render()">${label} (${n})</button>`;
  }).join("");

  const l = data.leads;
  document.getElementById("banner").innerHTML = l
    ? `<div class="banner ${l.state === "error" ? "error" : ""}">${spin(l)}${esc(l.message)}${since(l)}</div>` : "";

  const jobs = data.jobs.filter(j => j.status === tab);
  // Most recent first; jobs applied before dates were recorded go last.
  if (tab === "applied") jobs.sort((a, b) => (b.applied_at || "").localeCompare(a.applied_at || ""));
  const more = tab === "shortlisted"
    ? `<div class="actions toolbar"><button onclick="act({action:'lead'})" ${l?.state === "working" ? "disabled" : ""}>Add 1 more lead</button></div>` : "";
  document.getElementById("list").innerHTML = more + (jobs.length ? jobs.map(card).join("") : `<p class="empty">Nothing here.</p>`);
}

function card(j) {
  const d = j.score_detail || {};
  const id = esc(JSON.stringify(j.id));
  const warnings = Object.values(j.letter_warnings || {});
  const reverted = Object.entries(j.cv_lines_reverted || {});
  const file = n => `files/${j.folder}/${encodeURIComponent(n)}`;
  const pdfs = j.files.map(n => `<a href="${file(n)}" target="_blank">${esc(n.replace(/^.*?-(CV|Cover-Letter)\.pdf$/, "$1").replace("-", " "))}</a>`).join("");
  const actions = j.status === "shortlisted" ? `
      <button class="reject" onclick='act({id:${id},action:"reject"})'>Reject</button>
      <button class="interested" onclick='act({id:${id},action:"interested"})'>Interested</button>
      <button class="applied" onclick='act({id:${id},action:"applied"})'>Applied</button>`
    : j.status === "interested" ? `
      <button class="applied" onclick='act({id:${id},action:"applied"})'>Applied</button>
      <button class="reject" onclick='act({id:${id},action:"reject"})'>Reject</button>
      <button onclick='act({id:${id},action:"undo"})'>Back to review</button>`
    : `<button onclick='act({id:${id},action:"undo"})'>Back to review</button>`;

  return `<article class="card">
    <div class="head">
      <div class="score">${j.score}</div>
      <div>
        <div class="title">${esc(j.title)}${j.direct ? `<span class="tag" title="Only on the company's own job board so far">Direct</span>` : ""}</div>
        <div class="meta">${esc(j.company)} · ${esc(j.location || "location n/a")}${j.salary ? " · " + esc(j.salary) : ""} · via ${esc(j.source)}</div>
        ${j.status === "applied" ? `<div class="applied-on">${j.applied_at ? `You applied on ${ddmmyyyy(j.applied_at)}` : "Applied (date not recorded)"}</div>` : ""}
      </div>
    </div>
    <div class="links">
      <a href="${esc(j.apply_url || j.url)}" target="_blank" rel="noopener">Apply ↗</a>
      ${pdfs}
    </div>
    ${warnings.length ? `<div class="warn"><strong>Read the letter first:</strong><ul>${warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <details data-key="fit-${esc(j.folder)}" ${isOpen("fit-" + j.folder)}><summary>Why it fits${d.gaps?.length ? " and gaps" : ""}</summary>
      <ul class="plus">${(d.reasons || []).map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <ul class="minus">${(d.gaps || []).map(g => `<li>${esc(g)}</li>`).join("")}</ul>
    </details>
    ${reverted.length ? `<details data-key="rev-${esc(j.folder)}" ${isOpen("rev-" + j.folder)}><summary>${reverted.length} CV line${reverted.length > 1 ? "s" : ""} put back to the original</summary>
      <ul>${reverted.map(([k, v]) => `<li>${esc(v)}</li>`).join("")}</ul></details>` : ""}
    ${j.status === "interested" ? questions(j, id) : ""}
    <div class="actions">${actions}</div>
  </article>`;
}

function questions(j, id) {
  const t = j.task, a = j.application;
  const box = `<details data-key="qs-${esc(j.folder)}" ${isOpen("qs-" + j.folder, !a)}><summary>${a ? "Answer again" : "Questions"}</summary>
      <label class="meta">Application page URL (Greenhouse jobs are read automatically)</label>
      <input id="url-${esc(j.folder)}" placeholder="${esc(j.apply_url || "")}" value="${esc(drafts["url-" + j.folder])}">
      <label class="meta">…or paste the form's questions</label>
      <textarea id="q-${esc(j.folder)}">${esc(drafts["q-" + j.folder])}</textarea>
      <button onclick='ask(${id}, ${esc(JSON.stringify(j.folder))})'>Answer</button>
    </details>`;
  const status = t ? `<p class="${t.state === "error" ? "warn" : "meta"}">${spin(t)}${esc(t.message)}${since(t)}</p>` : "";
  const answers = a ? a.answers.map((x, i) => `<div class="answer">
      <div class="q">${esc(x.question)}</div>
      ${x.needs_input ? `<div class="warn">Needs you: ${esc(x.note)}</div>`
        : `<div class="a" id="a-${esc(j.folder)}-${i}">${esc(x.answer)}</div>
           <button class="copy" onclick="copy(this)">Copy</button>`}
      ${x.warning ? `<div class="warn">Check: ${esc(x.warning)}</div>` : ""}
    </div>`).join("") : "";
  return `<div class="qa">${status}${answers}${t?.state === "working" ? "" : box}</div>`;
}

function ask(id, folder) {
  act({ id, action: "interested", url: document.getElementById("url-" + folder).value,
        questions: document.getElementById("q-" + folder).value });
  delete drafts["url-" + folder];
  delete drafts["q-" + folder];
}

function copy(button) {
  navigator.clipboard.writeText(button.previousElementSibling.textContent);
  button.textContent = "Copied";
  setTimeout(() => (button.textContent = "Copy"), 1500);
}

load();
</script>
</body>
</html>
