name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'job_search/**'
      - 'templates/**'
      - 'fonts/**'
      - 'config.yaml'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

# Read-only by default; only build-and-deploy widens it, to push the image to GHCR.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install pyflakes && python -m pyflakes job_search

  build-and-deploy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/jonorl/job-search:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        # Pinned to a commit because this third-party action receives the VPS SSH key, and tags can be moved.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            docker compose -f ~/my-VPS/projects/docker-compose.yml pull job-search
            docker compose -f ~/my-VPS/projects/docker-compose.yml up -d job-search
